name: Deploy to S3

on:
  push:
    branches: [main]

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v3
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Get latest Hugo version
        env:
          # Authenticated API calls avoid the shared-runner-IP rate limit (60/hr)
          # that intermittently returned no tag and broke the download.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          LATEST_HUGO_VERSION=$(gh release view --repo gohugoio/hugo --json tagName --jq .tagName)
          if [[ -z "$LATEST_HUGO_VERSION" || "$LATEST_HUGO_VERSION" == "null" ]]; then
            echo "::error::Could not determine latest Hugo version"; exit 1
          fi
          echo "Installing Hugo ${LATEST_HUGO_VERSION}"
          curl -fsSL --retry 3 "https://github.com/gohugoio/hugo/releases/download/${LATEST_HUGO_VERSION}/hugo_extended_${LATEST_HUGO_VERSION#v}_linux-amd64.tar.gz" | tar -xzf - hugo

      - name: Move Hugo executable file
        run: |
          sudo mv hugo /usr/local/bin/
          hugo version

      - name: Install Packages
        run: npm install

      - name: Build the Site
        run: hugo --minify --environment production

      - name: Sync with AWS S3 bucket & invalidate Cloudfront cache
        run: |
          aws s3 sync ./public s3://${{ secrets.AWS_BUCKET }} --acl public-read
          aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT_ID }} --paths '/*'
